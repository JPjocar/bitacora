{% if page_obj.paginator.num_pages > 1 %}
<nav class="d-flex align-items-center justify-content-between gap-2 mt-3" aria-label="Paginación">
  {% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="{% querystring page=page_obj.previous_page_number %}">Anterior</a>{% else %}<span></span>{% endif %}
  <span class="small text-secondary">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="{% querystring page=page_obj.next_page_number %}">Siguiente</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
