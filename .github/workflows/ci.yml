name: Django PostgreSQL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bitacora
          POSTGRES_USER: bitacora
          POSTGRES_PASSWORD: ci-only-local-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U bitacora -d bitacora'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-key-abcdefghijklmnopqrstuvwxyz12345
      DJANGO_DEBUG: 'true'
      BITACORA_PUBLIC_URL: https://bitacora.example.edu
      PGDATABASE: bitacora
      PGUSER: bitacora
      PGPASSWORD: ci-only-local-password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/js/*.test.cjs
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py migrate --noinput
      - run: python manage.py sync_roles
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput -v 2
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: 'false'
