{% extends 'base.html' %}
{% block title %}Panel operativo · Bitacora{% endblock %}
{% block content %}
<h1>Panel operativo</h1>
<p class="text-secondary">Inventario, trabajo pendiente y prevención por equipo.</p>
<form method="get" class="card card-body mb-4" hx-get="{% url 'dashboard:panel' %}" hx-target="#dashboard-results" hx-swap="outerHTML" hx-push-url="true">
  <div class="row g-3">{% for field in form %}<div class="col-md-4"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}</div>{% endfor %}</div>
  <div class="mt-3"><button class="btn btn-primary">Aplicar filtros</button> <a class="btn btn-outline-secondary" href="{% url 'dashboard:panel' %}">Limpiar</a></div>
</form>
{% include 'dashboard/results.html' %}
{% endblock %}
